[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alkahest-chem"
version = "0.1.0"
description = "Solvent extraction and classification from chemical procedure texts"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Maarten R. Dobbelaere", email = "mrodobbe.Dobbelaere@UGent.be"},
]
keywords = ["chemistry", "solvents", "NLP", "NMR", "green chemistry", "USPTO"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.0",
    "tqdm",
]

[project.optional-dependencies]
rdkit = ["rdkit"]
ord = ["ord-schema"]
rxn-insight = ["rxn-insight>=0.1.2"]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "pyarrow",
    "rdkit",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "myst-parser",
]
all = ["rdkit", "ord-schema", "rxn-insight>=0.1.2"]

[project.scripts]
alkahest-extract = "alkahest.cli:extract_solvents"
alkahest-rxn-insight = "alkahest.cli:run_rxn_insight"

[project.urls]
Homepage = "https://solventexplorer.com"
Repository = "https://github.com/mrodobbe/Alkahest"
Documentation = "https://github.com/mrodobbe/Alkahest/tree/master/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alkahest = ["data/*.csv", "data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["alkahest"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
