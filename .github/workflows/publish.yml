name: Publish to PyPI

# Publishes on a GitHub release, or on demand from the Actions tab.
#
# Authentication uses PyPI Trusted Publishing, so no API token is stored here.
# Configure it once at https://pypi.org/manage/account/publishing/ with:
#   PyPI project name: alkahest-chem
#   Owner:             mrodobbe
#   Repository:        Alkahest
#   Workflow name:     publish.yml
#   Environment:       pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
